<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Consejos / amigas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/consejos.css">
</head>

<body id="consejos-body">
    <header>
        <a href="./" id="home-link" class="accent-hover">Amigas</a>
        <nav>
            <a href="./consejos.html" class="nav-link top-nav-link">Consejos</a>
            <a href="./rutas.html" class="nav-link top-nav-link">Rutas</a>
            <a href="./nosotras.html" class="nav-link top-nav-link">Nosotras</a>
        </nav>
    </header>
    <main>
        <h2 class="type-hover">Consejos</h2>
        <section id="consejo-section">
            <p class="consejos-intro">Si tienes algun consejo que darle a una amiga, escribelo aquí.</p>
            <p class="consejos-subtext">A todas nos hace falta ayuda alguna vez</p>
            
            <div id="feedback" style="display: none; margin-bottom: 1rem; font-family: var(--font); font-size: 1.2rem;"></div>


            <form action="" class="consejos-box">
                <fieldset>
                    <label for="consejo-input">Tu consejo:</label>
                    <textarea id="consejo-input" name="consejo" rows="4" cols="50"></textarea>
                </fieldset>

                    <div class="form-actions-row">
                        <div class="categoria-left">
                            <label for="categoria">Categoría:</label>
                            <select id="categoria" name="categoria" class="category-select">
                                <option value="rutas">Rutas</option>
                                <option value="vestimenta">Vestimenta</option>
                                <option value="vagones">Vagones</option>
                            </select>
                        </div>
                        <div class="submit-right">
                            <button type="submit">Enviar</button>
                        </div>
                    </div>
                
            </form>
            
        </section>
        <section id="consejos">
            
                <h4 class="consejos-otras-title type-hover">Consejos de otras amigas</h4>

            <div class="consejos-filter-wrapper">
                <nav class="consejos-otras-options consejos-filter-bar">
                    <a href="#rutas" class="filter-link" data-category="rutas">Rutas</a>
                    <a href="#vestimenta" class="filter-link" data-category="vestimenta">Vestimenta</a>
                    <a href="#vagones" class="filter-link" data-category="vagones">Vagones</a>
                </nav>
            </div>
        <section>
            
        </section>
            <ul id="consejos-list">
                <!-- list starts empty; messages are added via JS -->
            </ul>
        </section>
    </main>
    <footer id="site-footer">
        <div class="footer-content">
            <a href="./" class="footer-home-link accent-hover">Amigas</a>
            <nav class="footer-menu">
                <a href="./consejos.html" class="footer-menu-link">Consejos</a>
                <a href="./rutas.html" class="footer-menu-link">Rutas</a>
                <a href="./nosotras.html" class="footer-menu-link">Nosotras</a>
            </nav>
            <div class="footer-social">
                <div class="footer-credit">Por: Paola Cecilia y Victoria Betech</div>
                <a href="https://www.instagram.com/colectivo_amigas.mx/" target="_blank" class="footer-instagram">Instagram</a>
            </div>
        </div>
    </footer>
    <script src="./js/consejos.js"></script>
</body>


</html>
